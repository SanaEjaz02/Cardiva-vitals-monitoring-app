name: cardiva
description: AI-Based Wearable Health Monitoring and Emergency Response System.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Charts
  fl_chart: ^0.68.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.2

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.5
  firebase_app_check: ^0.3.1+5
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.3

  # SMS via OS (replaces Twilio — free, no API key)
  url_launcher: ^6.3.0

  # Real GPS location
  geolocator: ^13.0.2

  # Background foreground service (keeps vitals monitoring alive)
  flutter_background_service: ^5.0.9

  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  lottie: ^3.1.0
  flutter_dotenv: ^5.2.1
  http: ^1.2.1
  flutter_markdown: ^0.6.21
  flutter_local_notifications: ^17.0.0
  pdf: ^3.11.0
  share_plus: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/animations/
