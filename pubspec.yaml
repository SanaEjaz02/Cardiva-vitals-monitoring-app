name: cardiva
description: AI-Based Wearable Health Monitoring and Emergency Response System.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Charts
  fl_chart: ^0.68.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.2

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_database: ^11.1.6
  firebase_storage: ^12.3.5
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.3

  # SMS via OS (replaces Twilio — free, no API key)
  url_launcher: ^6.3.0

  # Real GPS location
  geolocator: ^13.0.2

  # Background foreground service (keeps vitals monitoring alive)
  flutter_background_service: ^5.0.9

  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  lottie: ^3.1.0
  flutter_dotenv: ^5.2.1
  http: ^1.2.1
  flutter_markdown: ^0.6.21
  flutter_local_notifications: ^17.0.0
  pdf: ^3.11.0
  share_plus: ^10.0.0
  flutter_blue_plus: ^1.35.5
  speech_to_text: ^7.0.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3
  sqflite: ^2.4.1
  path: ^1.9.0
  connectivity_plus: ^6.1.4
  file_picker: ^8.1.7
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0077B6"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/animations/
    - assets/audio/
